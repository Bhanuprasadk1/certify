# CertiFlow — Self-Contained Multi-Service Docker Compose Stack
# Runs PostgreSQL, Redis, RabbitMQ, migrations/seed, API, 4 workers, and Frontend
# with ZERO dependency on host-installed databases, Redis, or RabbitMQ.
# Docker Hub Namespace: https://app.docker.com/accounts/bhanuprasadk1

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: 4000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-certiflow}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-in-production-certiflow-jwt-secret-min-32-chars}
  ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-30}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-certiflow}:${RABBITMQ_DEFAULT_PASS:-certiflow}@rabbitmq:5672
  QUEUE_DRIVER: rabbitmq
  STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
  DEMO_MODE: ${DEMO_MODE:-true}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@1234}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
  API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
  VERIFY_RATE_LIMIT: ${VERIFY_RATE_LIMIT:-60}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-certiflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-certiflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-certiflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-certiflow}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate-and-seed:
    image: bhanuprasadk1/certiflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - certstorage:/app/storage
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/seed/run.js --if-empty"]
    restart: "no"

  api:
    image: bhanuprasadk1/certiflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - certstorage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  certificate-worker:
    image: bhanuprasadk1/certiflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    command: ["node", "dist/workers/certificate.worker.js"]
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - certstorage:/app/storage

  delivery-worker:
    image: bhanuprasadk1/certiflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    command: ["node", "dist/workers/delivery.worker.js"]
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  outbox-publisher:
    image: bhanuprasadk1/certiflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    command: ["node", "dist/workers/outbox.worker.js"]
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  scheduler:
    image: bhanuprasadk1/certiflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    command: ["node", "dist/workers/scheduler.worker.js"]
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully

  frontend:
    image: bhanuprasadk1/certiflow-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  certstorage:
